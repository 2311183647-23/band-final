    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&family=Silkscreen&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #1A1A1C; /* Lighter Graphite / Warm-Cool Neutral */
        --color-gold: #D4AF37; /* Pale Gold */
        --color-orange: #FF4500; /* Alert Orange */
        --color-text: #E5E5E5;
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Inter', sans-serif;
        font-weight: 200; /* Ultra Light default */
        overflow-x: hidden;
      }
      
      /* Tech/Data Font */
      .font-pixel {
        font-family: 'Silkscreen', cursive;
      }
      
      /* Postmodern Font (replaces serif) */
      .font-postmodern {
        font-family: 'Space Grotesk', sans-serif;
      }
      
      /* Song Font (宋体) */
      .font-song {
        font-family: 'SimSun', '宋体', 'STSong', serif;
      }

      /* Hide cursor on non-touch devices to use custom cursor */
      @media (hover: hover) and (pointer: fine) {
        body {
          cursor: none;
        }
        a, button, [role="button"], input, textarea {
          cursor: none;
        }
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 2px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-gold); 
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }
      
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 120s linear infinite;
      }
      .animate-spin-reverse {
        animation: spin-slow 150s linear infinite reverse;
      }

      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.2)); }
        50% { filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5)); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 4s ease-in-out infinite;
      }

      /* Invert Utility */
      .hover-invert {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .hover-invert:hover {
        background-color: var(--color-gold);
        color: #000;
        box-shadow: 0 0 20px var(--color-gold);
      }
    </style>
